name: Cypress Cross-Browser & Cross-OS Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  cypress-run:
    name: "${{ matrix.os }} | ${{ matrix.browser }}"
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false   # keep running other combos if one fails
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        browser: [chrome, firefox, edge]
        exclude:
          # Edge is not available on Linux or macOS runners
          - os: ubuntu-latest
            browser: edge
          - os: macos-latest
            browser: edge

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Cypress tests (${{ matrix.browser }} on ${{ matrix.os }})
        uses: cypress-io/github-action@v6
        with:
          browser: ${{ matrix.browser }}
          start: npm start
          wait-on: 'http://localhost:3000'

      - name: Upload failure screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: screenshots-${{ matrix.os }}-${{ matrix.browser }}
          path: cypress/screenshots
          retention-days: 7
