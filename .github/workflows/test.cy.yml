on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  # ── Security audit — runs first, fast, fails loud ──────────────────────────
  security-audit:
    name: "Security Audit"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci

      - name: Check for known vulnerabilities
        run: npm audit --audit-level=high
        # Fails if any high or critical vulnerabilities found in dependencies

  # ── Cypress E2E — cross-browser / cross-OS matrix ─────────────────────────
  cypress-run:
    name: "${{ matrix.os }} | ${{ matrix.browser }}"
    runs-on: ${{ matrix.os }}
    needs: security-audit          # don't run tests if audit fails

    strategy:
      fail-fast: false             # get full results across all combos
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        browser: [chrome, firefox, edge]
        exclude:
          - os: ubuntu-latest
            browser: edge
          - os: macos-latest
            browser: edge

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Cypress tests (${{ matrix.browser }} on ${{ matrix.os }})
        uses: cypress-io/github-action@v6
        with:
          browser: ${{ matrix.browser }}
          start: npm start
          wait-on: 'http://localhost:3000'
          wait-on-timeout: 30

      - name: Upload screenshots on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: screenshots-${{ matrix.os }}-${{ matrix.browser }}
          path: cypress/screenshots
          retention-days: 7